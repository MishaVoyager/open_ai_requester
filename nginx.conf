server {
    listen 80;
    server_name mishavoyager.fyi;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mishavoyager.fyi;

    ssl_certificate /etc/letsencrypt/live/mishavoyager.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishavoyager.fyi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_buffer_size 16384;

    location /callback {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /k/vzvfARYUpfGBCDHG6NOC4HRa/ {
        alias /var/www/outline-keys/;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location /o/m860hMrhQPhkOKbLg8MeDFpj {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_max_temp_file_size 0;
        tcp_nodelay on;
        tcp_nopush off;
        client_max_body_size 0;
    }

    location /o/b8X5AnyXvAjV6cJlrmGihuNP {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_max_temp_file_size 0;
        tcp_nodelay on;
        tcp_nopush off;
        client_max_body_size 0;
    }

    location / {
        proxy_pass http://127.0.0.1:7999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
